<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ContentSkills Proxy</title>
<style>
  body { font-family: system-ui, sans-serif; background: #FCF7F1; color: #1A1A1F; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .card { background: white; border: 1.5px solid #E3DCCC; border-radius: 16px; padding: 40px 48px; text-align: center; max-width: 400px; }
  .dot { width: 10px; height: 10px; background: #2F6B4C; border-radius: 50%; display: inline-block; margin-right: 8px; }
  h1 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; }
  p { font-size: 14px; color: #6B6660; margin: 0; line-height: 1.6; }
  code { font-family: monospace; background: #F2ECE1; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <span class="dot"></span><strong>Proxy is running</strong>
  <h1>ContentSkills API Proxy</h1>
  <p>Send <code>POST</code> requests to <code>/api/claude</code></p>
</div>
</body>
</html>
